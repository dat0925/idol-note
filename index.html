<!DOCTYPE html>
<html lang="ja" data-mode="kid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6fa5">
<meta name="description" content="アイドルになりたい夢を、まいにちの練習から本番まで親子でいっしょに管理するノート">
<title>アイドルノート</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<!-- iOS は透過を黒く塗るので、背景を敷いた専用ファイルを渡す -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アイドルノート">

<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/kid.css">
<link rel="stylesheet" href="./css/adult.css">
<link rel="stylesheet" href="./css/stage.css">

<script>
  // ちらつき（FOUC）防止: CSSより先にモードを確定させる。
  // localStorage に保存された表示モードを、描画前に html 要素へ適用する。
  try {
    var m = localStorage.getItem('idol:mode');
    if (m !== 'adult' && m !== 'kid') m = 'kid';
    document.documentElement.dataset.mode = m;
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', m === 'adult' ? '#6c63c7' : '#ff6fa5');
  } catch (e) { /* プライベートモード等で localStorage が使えなくても続行 */ }
</script>
</head>
<body>

<!-- 起動スプラッシュ。app.js が認証判定を終えたら外す -->
<div id="boot" class="boot">
  <!-- 起動画面には「その子が選んだ」背景イラストを出す。
       ★サムネ（220px）を使う。本体は300KB前後あり、起動を待たせてしまう。
         サムネは全種を Service Worker が先読みしているので、
         2回目以降はオフラインでも即座に出る。
       ★CSS変数ではなく img の src にしている。
         カスタムプロパティに入れた相対URLは「使う側のCSSファイル」基準で
         解決されるため ./assets が /css/assets になって404になった。
         img の src ならドキュメント基準なので、GitHub Pages のサブパスでも壊れない。 -->
  <img class="boot__hero" src="./assets/idol-hero-1-thumb.webp" alt="" decoding="async">
  <p class="boot__text">読み込み中…</p>
</div>
<script>
  // 直後に置いて即座に差し替える（描画前なのでチラつかない）
  try {
    var h = parseInt(localStorage.getItem('idol:hero'), 10);
    if (h >= 2 && h <= 7) {
      document.querySelector('.boot__hero').src = './assets/idol-hero-' + h + '-thumb.webp';
    }
  } catch (e) { /* 既定の1枚目のままで問題ない */ }
</script>

<div id="shell" class="shell" hidden>
  <!-- ヘッダ -->
  <header class="hdr">
    <button class="hdr__brand" type="button" data-nav="#/home">
      <!-- 装飾ではなくアプリの顔なので img で置く。
           alt は空。すぐ隣に同じ文字（hdrTitle）があり、読み上げが二重になるため -->
      <img class="hdr__logo" src="./assets/logo-96.webp" alt="" width="32" height="32" decoding="async">
      <span class="hdr__title" id="hdrTitle">アイドルノート</span>
    </button>
    <div class="hdr__right">
      <span class="streak-badge" id="streakBadge" hidden>🔥 <b>0</b>日</span>
      <button class="hdr__mode" id="modeToggle" type="button" hidden></button>
      <button class="hdr__avatar" id="userMenu" type="button" aria-label="アカウント">👤</button>
    </div>
  </header>

  <!-- PC用サイドバー（おとなモードのみ表示） -->
  <nav class="side" id="sideNav" aria-label="メインメニュー"></nav>

  <!-- 画面本体 -->
  <main class="main" id="app" tabindex="-1"></main>

  <!-- スマホ用ボトムナビ -->
  <nav class="bottom" id="bottomNav" aria-label="メインメニュー"></nav>
</div>

<!-- モーダル/トースト/演出のマウント先 -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>
<div id="fxRoot" class="fx-root" aria-hidden="true"></div>

<!-- 更新バー -->
<div id="updateBar" class="update-bar" hidden>
  <span>新しいバージョンがあります</span>
  <button type="button" id="updateLater" class="btn btn--ghost btn--sm">あとで</button>
  <button type="button" id="updateNow" class="btn btn--primary btn--sm">更新</button>
</div>

<!-- オフライン表示 -->
<div id="offlineBar" class="offline-bar" hidden>📴 オフラインです。記録は端末に保存され、つながったら送信されます。</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
